# Coolify deployment of OpenMAIC (app + PostgreSQL, no video-export service).
# The image is built by GitHub Actions (.github/workflows/build-image.yml) and
# pulled from ghcr.io, so the Coolify server never compiles anything.
# Upstream docker-compose.yml is left untouched so the fork can keep syncing.
# In Coolify: set "Docker Compose Location" to /docker-compose.coolify.yml and
# assign the domain to the `openmaic` service on port 3000.
services:
  openmaic:
    image: ghcr.io/broslunas/openmaic:latest
    pull_policy: always
    environment:
      - DATABASE_URL=postgres://openmaic:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/openmaic
      - OWNER_SINGLE_USER=true
      - ACCESS_CODE=${SERVICE_PASSWORD_ACCESSCODE}
      - OPENMAIC_SECRET_KEY=${SERVICE_PASSWORD_64_SECRETKEY}
      # Legacy env-based model config (no openmaic.yml): ai.broslunas.com is
      # OpenAI-compatible, so it is wired in through the OpenAI provider.
      - OPENAI_API_KEY=${BROSLUNAS_API_KEY:?set your ai.broslunas.com API key}
      - OPENAI_BASE_URL=https://ai.broslunas.com/v1
      - OPENAI_MODELS=top-models
      - DEFAULT_MODEL=openai:top-models
    volumes:
      - openmaic-data:/app/data
    mem_limit: 1536m
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=openmaic
      - POSTGRES_USER=openmaic
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openmaic -d openmaic']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - openmaic-postgres:/var/lib/postgresql/data
    mem_limit: 512m
    restart: unless-stopped

volumes:
  openmaic-data:
  openmaic-postgres:
